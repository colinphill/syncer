name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.3.13750724

jobs:
  host-clients:
    name: ${{ matrix.name }} client
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            preset: linux
          - name: macOS
            os: macos-14
            preset: macos

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run unit tests
        run: ctest --test-dir out/build/${{ matrix.preset }} --output-on-failure

      - name: Run client
        run: ./out/build/${{ matrix.preset }}/syncer version

      - name: Build and test managed client
        run: |
          dotnet restore managed/Syncer.Managed.slnx
          dotnet build managed/Syncer.Managed.slnx --configuration Release --no-restore
          dotnet test managed/Syncer.Managed.slnx --configuration Release --no-build --no-restore

  build-and-test:
    name: Windows and Android
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Select Android NDK
        shell: pwsh
        run: |
          $sdkRoot = if ($env:ANDROID_SDK_ROOT) { $env:ANDROID_SDK_ROOT } else { $env:ANDROID_HOME }
          if (-not $sdkRoot) { throw 'The runner does not provide an Android SDK.' }
          $ndk = Join-Path $sdkRoot "ndk/$env:NDK_VERSION"
          if (-not (Test-Path $ndk)) {
            $sdkManagerCommand = Get-Command sdkmanager.bat -ErrorAction SilentlyContinue
            if ($sdkManagerCommand) {
              $sdkManagerPath = $sdkManagerCommand.Source
            } else {
              $sdkManagerPath = Join-Path $sdkRoot 'cmdline-tools/latest/bin/sdkmanager.bat'
              if (-not (Test-Path $sdkManagerPath)) { throw 'sdkmanager.bat was not found.' }
            }
            & $sdkManagerPath --install "ndk;$env:NDK_VERSION"
            if ($LASTEXITCODE -ne 0) { throw "Android NDK installation failed with exit code $LASTEXITCODE." }
          }
          "ANDROID_NDK_HOME=$ndk" >> $env:GITHUB_ENV

      - name: Build release package
        shell: pwsh
        run: ./scripts/build-package.ps1 -Configuration Release

      - name: Run unit tests
        shell: pwsh
        run: ctest --test-dir out/build/windows -C Release --output-on-failure

      - name: Verify package layout
        shell: pwsh
        run: |
          $expected = @(
            'out/package/syncer-Release/syncer.exe',
            'out/package/syncer-Release/servers/arm64-v8a/syncerd',
            'out/package/syncer-Release/servers/armeabi-v7a/syncerd',
            'out/package/syncer-Release/servers/x86_64/syncerd',
            'out/package/syncer-Release/servers/x86/syncerd'
          )
          foreach ($path in $expected) {
            if (-not (Test-Path $path -PathType Leaf)) { throw "Missing package file: $path" }
          }
          & ./out/package/syncer-Release/syncer.exe version
          if ($LASTEXITCODE -ne 0) { throw "Packaged client failed with exit code $LASTEXITCODE." }

      - name: Build and test managed client
        shell: pwsh
        run: |
          dotnet restore managed/Syncer.Managed.slnx
          dotnet build managed/Syncer.Managed.slnx --configuration Release --no-restore
          dotnet test managed/Syncer.Managed.slnx --configuration Release --no-build --no-restore

      - name: Pack and verify managed packages
        shell: pwsh
        run: |
          ./scripts/build-managed-packages.ps1 -Configuration Release
          $env:SYNCER_REQUIRE_EMBEDDED_SERVERS = '1'
          dotnet test managed/tests/Syncer.Client.Tests/Syncer.Client.Tests.csproj --configuration Release --no-restore -p:SyncerServerRoot="$PWD/out/package/syncer-Release/servers" --filter EmbeddedServerSetIsCompleteWhenPresent
          $toolPath = Join-Path $PWD 'out/tool-test'
          dotnet tool install Syncer.Tool --tool-path $toolPath --version 0.2.0 --add-source "$PWD/out/package/nuget" --no-cache
          & (Join-Path $toolPath 'syncer-managed.exe') version
          if ($LASTEXITCODE -ne 0) { throw "Packaged managed tool failed with exit code $LASTEXITCODE." }
